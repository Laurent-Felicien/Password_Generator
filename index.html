<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Générateur de mots de passe sécurisé — gratuit et sans traçage">
  <title>Password Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Grille de fond animée -->
  <div class="bg-grid" aria-hidden="true"></div>

  <main class="card">

    <!-- En-tête -->
    <div class="card-header">
      <div class="terminal-dot red"></div>
      <div class="terminal-dot yellow"></div>
      <div class="terminal-dot green"></div>
      <span class="terminal-title">password-generator.sh</span>
    </div>

    <div class="card-body">

      <h1>
        <span class="icon">🔐</span>
        Password Generator
      </h1>
      <p class="subtitle">Générez un mot de passe fort et sécurisé instantanément.</p>

      <!-- Zone d'affichage du mot de passe -->
      <div class="password-zone">
        <input
          type="text"
          id="password"
          readonly
          placeholder="Cliquez sur Générer..."
          aria-label="Mot de passe généré"
        >
        <button id="btn-copy" title="Copier" aria-label="Copier le mot de passe">
          <svg id="icon-copy" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
          <svg id="icon-check" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display:none">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </button>
      </div>

      <!-- Indicateur de force -->
      <div class="strength-bar">
        <div class="strength-track">
          <div class="strength-fill" id="strength-fill"></div>
        </div>
        <span class="strength-label" id="strength-label">—</span>
      </div>

      <!-- Options -->
      <div class="options">

        <!-- Longueur -->
        <div class="option-row">
          <label for="length-slider">Longueur : <strong id="length-value">12</strong></label>
          <input
            type="range"
            id="length-slider"
            min="6"
            max="32"
            value="12"
            aria-label="Longueur du mot de passe"
          >
        </div>

        <!-- Cases à cocher -->
        <div class="checkboxes">
          <label class="checkbox-item">
            <input type="checkbox" id="opt-upper" checked>
            <span class="checkbox-custom"></span>
            Majuscules <em>A–Z</em>
          </label>
          <label class="checkbox-item">
            <input type="checkbox" id="opt-lower" checked>
            <span class="checkbox-custom"></span>
            Minuscules <em>a–z</em>
          </label>
          <label class="checkbox-item">
            <input type="checkbox" id="opt-numbers" checked>
            <span class="checkbox-custom"></span>
            Chiffres <em>0–9</em>
          </label>
          <label class="checkbox-item">
            <input type="checkbox" id="opt-symbols" checked>
            <span class="checkbox-custom"></span>
            Symboles <em>!@#$...</em>
          </label>
        </div>

      </div>

      <!-- Bouton principal -->
      <button id="btn-generate">
        <span>⚡ Générer un mot de passe</span>
      </button>

    </div>

    <!-- Footer de la carte -->
    <div class="card-footer">
      <span>🔒 Généré localement — aucune donnée envoyée</span>
      <span class="version">v1.0.0</span>
    </div>

  </main>

  <script src="script.js" defer></script>
</body>
</html>
